<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vietnamese Recipes & Shopping List</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-green-700 flex items-center justify-center gap-2">
                <i data-lucide="chef-hat"></i>
                Vietnamese Recipes & Shopping List
            </h1>
            <p class="text-gray-600">Lên thực đơn và danh sách mua sắm dễ dàng</p>
        </header>

        <div class="grid md:grid-cols-2 gap-6">
            
            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2 text-orange-600">
                    <i data-lucide="book-open"></i> Gợi ý Món Ăn
                </h2>
                
                <div class="space-y-3" id="recipe-list">
                    <div class="border p-3 rounded-lg hover:bg-orange-50 transition cursor-pointer group">
                        <div class="flex justify-between items-center">
                            <span class="font-medium">Phở Bò</span>
                            <button onclick="addRecipeToShoppingList('Phở Bò')" class="text-sm bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200 flex items-center gap-1">
                                <i data-lucide="plus" class="w-4 h-4"></i> Thêm
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Bánh phở, thịt bò, xương ống, thảo mộc...</p>
                    </div>

                    <div class="border p-3 rounded-lg hover:bg-orange-50 transition cursor-pointer group">
                        <div class="flex justify-between items-center">
                            <span class="font-medium">Bánh Mì Chảo</span>
                            <button onclick="addRecipeToShoppingList('Bánh Mì Chảo')" class="text-sm bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200 flex items-center gap-1">
                                <i data-lucide="plus" class="w-4 h-4"></i> Thêm
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Trứng, pate, xúc xích, dưa leo, bánh mì...</p>
                    </div>

                     <div class="border p-3 rounded-lg hover:bg-orange-50 transition cursor-pointer group">
                        <div class="flex justify-between items-center">
                            <span class="font-medium">Gỏi Cuốn</span>
                            <button onclick="addRecipeToShoppingList('Gỏi Cuốn')" class="text-sm bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200 flex items-center gap-1">
                                <i data-lucide="plus" class="w-4 h-4"></i> Thêm
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Tôm, thịt ba chỉ, bánh tráng, rau sống...</p>
                    </div>
                </div>
            </div>

            <div class="card p-6">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2 text-blue-600">
                    <i data-lucide="shopping-cart"></i> Danh sách mua sắm
                </h2>

                <div class="flex gap-2 mb-4">
                    <input type="text" id="newItemInput" placeholder="Thêm món cần mua..." 
                        class="flex-1 border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    <button onclick="addItem()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        <i data-lucide="plus"></i>
                    </button>
                </div>

                <ul id="shopping-list" class="space-y-2 mb-4 max-h-80 overflow-y-auto">
                    <li class="flex items-center gap-2 p-2 bg-gray-50 rounded">
                        <input type="checkbox" class="w-5 h-5 accent-blue-600">
                        <span class="flex-1">Nước mắm</span>
                    </li>
                </ul>

                <div class="border-t pt-4 flex justify-between items-center">
                    <span id="item-count" class="text-sm text-gray-500">1 mục</span>
                    <button onclick="deleteSelected()" class="text-red-600 hover:text-red-800 text-sm font-medium flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Xóa mục đã chọn
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. Initialize Icons
        lucide.createIcons();

        // 2. Shopping List Logic
        const listEl = document.getElementById('shopping-list');
        const inputEl = document.getElementById('newItemInput');
        const countEl = document.getElementById('item-count');

        // Allow pressing Enter to add
        inputEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addItem();
        });

        function addItem(text = null) {
            const value = text || inputEl.value.trim();
            if (!value) return;

            const li = document.createElement('li');
            li.className = "flex items-center gap-2 p-2 bg-gray-50 rounded hover:bg-gray-100 transition";
            li.innerHTML = `
                <input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer">
                <span class="flex-1 cursor-pointer" onclick="this.previousElementSibling.click()">${value}</span>
            `;
            
            listEl.appendChild(li);
            if (!text) inputEl.value = ''; // Clear input if typed
            updateCount();
        }

        function deleteSelected() {
            const checkboxes = listEl.querySelectorAll('input[type="checkbox"]:checked');
            checkboxes.forEach(cb => cb.parentElement.remove());
            updateCount();
        }

        function updateCount() {
            const count = listEl.children.length;
            countEl.innerText = count + " mục";
        }

        // Helper to add ingredients from recipes (Simulated)
        function addRecipeToShoppingList(recipeName) {
            // Mapping recipe names to simple ingredients
            const ingredients = {
                'Phở Bò': ['Bánh phở', 'Thịt bò'],
                'Bánh Mì Chảo': ['Bánh mì', 'Pate', 'Trứng'],
                'Gỏi Cuốn': ['Bánh tráng', 'Tôm', 'Thịt heo']
            };

            const itemsToAdd = ingredients[recipeName] || [recipeName];
            itemsToAdd.forEach(item => addItem(item));
            alert(`Đã thêm nguyên liệu cho món: ${recipeName}`);
        }
    </script>
</body>
</html>
