    tailwind.config = {

        }

<style>
    /* Local Reset for the Game Container Only */
    #esl-game-container {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        box-sizing: border-box;
        line-height: 1.5;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        background-color: #f1f5f9; /* Slate-100 */
        padding: 1rem;
        border-radius: 1rem;
    }
    #esl-game-container *, #esl-game-container *::before, #esl-game-container *::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: #e5e7eb;
    }
    /* Fix buttons losing style when Preflight is off */
    #esl-game-container button {
        cursor: pointer;
        background-color: transparent;
        background-image: none;
    }
    /* Animations */
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .animate-pop { animation: pop 0.3s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .animate-shake { animation: shake 0.4s ease-in-out; }

    .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
</style>

<div id="esl-game-container">
    <div id="root">Loading Game...</div>
</div>

<script type="text/babel">
    const { useState, useEffect } = React;
    const { 
        Bug, Bird, Cat, Dog, Hexagon, Milk, 
        Map: MapIcon, Library, Palette, Utensils, 
        Dumbbell, Music, Flag, CheckCircle, XCircle, 
        ArrowRight, RefreshCw, Trophy, AlertCircle 
    } = lucideReact;

    /* --- DATA --- */
    const LOCATIONS = [
        { id: 'art', label: 'Art Room', icon: <Palette className="w-8 h-8" /> },
        { id: 'lib', label: 'Library', icon: <Library className="w-8 h-8" /> },
        { id: 'can', label: 'Canteen', icon: <Utensils className="w-8 h-8" /> },
        { id: 'gym', label: 'Gym', icon: <Dumbbell className="w-8 h-8" /> },
        { id: 'mus', label: 'Music Room', icon: <Music className="w-8 h-8" /> },
        { id: 'fld', label: 'Football Field', icon: <Flag className="w-8 h-8" /> },
    ];

    const STAGES = [
        {
            animal: 'Spider', icon: <Bug className="w-6 h-6" />, type: 'HANGMAN',
            intro: "To catch the fly, I need a Spider! Solve these words to find one.",
            questions: [
                { answer: "ORGANISING", hint: "Planning/arranging" },
                { answer: "DECORATE", hint: "Making the room look nice" },
                { answer: "BALLOONS", hint: "Floating party items" },
                { answer: "SUMMER", hint: "The season of the event" },
                { answer: "AMAZING", hint: "Adjective for 'very good'" }
            ]
        },
        {
            animal: 'Bird', icon: <Bird className="w-6 h-6" />, type: 'CLOZE',
            intro: "To catch the spider, I need a Bird! Choose the correct prepositions.",
            questions: [
                { text: "Thanks ___ your email.", options: ["at", "for", "on"], answer: "for" },
                { text: "Give my love ___ your parents.", options: ["to", "at", "with"], answer: "to" },
                { text: "Lots ___ love,", options: ["of", "off", "on"], answer: "of" },
                { text: "Say 'Hi' ___ your sister.", options: ["to", "for", "by"], answer: "to" },
                { text: "That's all ___ me.", options: ["from", "by", "of"], answer: "from" }
            ]
        },
        {
            animal: 'Cat', icon: <Cat className="w-6 h-6" />, type: 'UNSCRAMBLE',
            intro: "To catch the bird, I need a Cat! Put the words in the correct order.",
            questions: [
                { words: ["How", "are", "things?"], answer: "How are things?" },
                { words: ["I", "hope", "to", "see", "you", "soon."], answer: "I hope to see you soon." },
                { words: ["The", "event", "is", "next", "Saturday."], answer: "The event is next Saturday." },
                { words: ["It", "is", "going", "to", "be", "amazing."], answer: "It is going to be amazing." },
                { words: ["We", "are", "selling", "pizza", "and", "ice cream."], answer: "We are selling pizza and ice cream." }
            ]
        },
        {
            animal: 'Dog', icon: <Dog className="w-6 h-6" />, type: 'ORDERING',
            intro: "To catch the cat, I need a Dog! Arrange the sentence chunks logically.",
            questions: [
                { chunks: ["your email.", "Hi Sam,", "Thanks for"], answer: "Hi Sam, Thanks for your email." },
                { chunks: ["exciting news.", "because I have", "I am writing"], answer: "I am writing because I have exciting news." },
                { chunks: ["and dancing.", "students singing", "We have ten"], answer: "We have ten students singing and dancing." },
                { chunks: ["watch the show?", "like to come", "Would you"], answer: "Would you like to come watch the show?" },
                { chunks: ["Best wishes.", "for now,", "That's all"], answer: "That's all for now, Best wishes." }
            ]
        },
        {
            animal: 'Goat', icon: <Hexagon className="w-6 h-6" />, type: 'MULTIPLE_CHOICE',
            intro: "To catch the dog, I need a Goat! Select the best phrase for the context.",
            questions: [
                { prompt: "You want to ask about their life.", options: ["How are things?", "Who are you?"], answer: "How are things?" },
                { prompt: "You want to mention the time.", options: ["The event is next Saturday.", "The event is going to be amazing."], answer: "The event is next Saturday." },
                { prompt: "You want to give them a ticket.", options: ["I can get you a free ticket.", "Buy a ticket now."], answer: "I can get you a free ticket." },
                { prompt: "You want to say you are finished writing.", options: ["That's all from me.", "I am stopping."], answer: "That's all from me." },
                { prompt: "You want to sign off warmly.", options: ["Best wishes,", "Goodbye sir,"], answer: "Best wishes," }
            ]
        }
    ];

    const WINNING_EMAIL = `
Hi Sam,

Thanks for your email. How are things?
I am writing because I have exciting news.

The event is next Saturday. We have ten students singing and dancing.
It is going to be amazing. We are selling pizza and ice cream.

I can get you a free ticket. Would you like to come watch the show?

That's all for now. Give my love to your parents.

Best wishes,
[Your Name]
    `;

    /* --- COMPONENTS --- */

    function OldLadySchoolGame() {
        const [view, setView] = useState('intro');
        const [stageIndex, setStageIndex] = useState(0); 
        const [questionIndex, setQuestionIndex] = useState(0); 
        const [inventory, setInventory] = useState([]);
        const [currentLocation, setCurrentLocation] = useState(null);
        
        const handleStartGame = () => setView('map');
        const handleLocationClick = (loc) => {
            setCurrentLocation(loc);
            setQuestionIndex(0);
            setView('game');
        };
        const handleStageComplete = () => {
            const collectedAnimal = STAGES[stageIndex].animal;
            const newInventory = [...inventory, collectedAnimal];
            setInventory(newInventory);
            if (stageIndex < STAGES.length - 1) {
                setStageIndex(stageIndex + 1);
                setView('map');
            } else {
                setView('logicTrap');
            }
        };
        const handleLogicTrapSuccess = () => setView('victory');

        return (
            <div className="flex flex-col items-center p-2 md:p-4 text-slate-800">
                {/* HEADER */}
                <header className="w-full bg-white shadow-md rounded-xl p-4 mb-6 flex justify-between items-center border-b-4 border-slate-300">
                    <div className="bg-yellow-400 p-2 rounded-full shadow-sm">
                        <span className="font-bold text-yellow-900 text-xs md:text-base">$1B REWARD</span>
                    </div>
                    <div className="flex gap-2">
                        {inventory.map((anim, i) => (
                            <div key={i} className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold border border-green-300">
                                {anim}
                            </div>
                        ))}
                    </div>
                </header>

                <main className="w-full flex-grow">
                    {view === 'intro' && <IntroScreen onStart={handleStartGame} />}
                    {view === 'map' && <MapScreen onLocationSelect={handleLocationClick} stageIndex={stageIndex} />}
                    {view === 'game' && (
                    <GameEngine 
                        stageData={STAGES[stageIndex]} 
                        questionIndex={questionIndex}
                        setQuestionIndex={setQuestionIndex}
                        onStageComplete={handleStageComplete}
                        currentLocation={currentLocation}
                    />
                    )}
                    {view === 'logicTrap' && <LogicTrap inventory={inventory} onSuccess={handleLogicTrapSuccess} />}
                    {view === 'victory' && <VictoryScreen />}
                </main>
            </div>
        );
    }

    function IntroScreen({ onStart }) {
        return (
            <div className="bg-white p-8 rounded-2xl shadow-xl text-center border-2 border-slate-200">
                <div className="mb-6 flex justify-center"><div className="w-24 h-24 bg-purple-100 rounded-full flex items-center justify-center"><span className="text-4xl">👵</span></div></div>
                <h1 className="text-3xl font-extrabold text-slate-900 mb-4">The Old Lady's School Search</h1>
                <p className="text-lg text-slate-600 mb-6">I swallowed a fly! Oh my, oh my! <br/>Help me find animals to catch it.</p>
                <button onClick={onStart} className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full text-xl transition-all shadow-lg transform hover:scale-105">Start Searching</button>
            </div>
        );
    }

    function MapScreen({ onLocationSelect, stageIndex }) {
        const currentTarget = STAGES[stageIndex];
        return (
            <div className="bg-white p-6 rounded-2xl shadow-xl border-2 border-slate-200">
                <div className="text-center mb-6">
                    <h2 className="text-xl font-bold text-slate-700">Where should we look?</h2>
                    <div className="flex items-center justify-center gap-2 mt-2 text-purple-600 bg-purple-50 py-2 rounded-lg">
                        <span>Hunting for:</span> {currentTarget.icon} <span className="font-bold">{currentTarget.animal}</span>
                    </div>
                </div>
                <div className="grid grid-cols-2 gap-4">
                    {LOCATIONS.map((loc) => (
                    <button key={loc.id} onClick={() => onLocationSelect(loc)} className="flex flex-col items-center justify-center p-6 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-xl transition-all gap-2 group">
                        <div className="text-slate-500 group-hover:text-blue-500 transition-colors">{loc.icon}</div>
                        <span className="font-bold text-slate-700">{loc.label}</span>
                    </button>
                    ))}
                </div>
            </div>
        );
    }

    function VictoryScreen() {
        return (
            <div className="bg-white p-8 rounded-2xl shadow-xl border-4 border-yellow-400 text-center animate-fade-in">
                <div className="flex justify-center mb-4"><Trophy className="w-20 h-20 text-yellow-500" /></div>
                <h2 className="text-3xl font-bold text-slate-800 mb-2">CONGRATULATIONS!</h2>
                <div className="bg-slate-50 p-6 rounded-lg text-left border border-slate-200 font-mono text-sm shadow-inner mb-6">
                    <pre className="whitespace-pre-wrap font-sans text-slate-700">{WINNING_EMAIL}</pre>
                </div>
            </div>
        );
    }

    function LogicTrap({ inventory, onSuccess }) {
        const [sequence, setSequence] = useState([]);
        const [error, setError] = useState(false);
        const correctOrder = inventory; 
        const handleSelect = (animal) => {
            setError(false);
            const newSeq = [...sequence, animal];
            setSequence(newSeq);
            const currentIndex = newSeq.length - 1;
            if (newSeq[currentIndex] !== correctOrder[currentIndex]) {
                setError(true);
                setTimeout(() => setSequence([]), 1000); 
            } else if (newSeq.length === correctOrder.length) {
                setTimeout(onSuccess, 500);
            }
        };
        return (
            <div className="bg-white p-6 rounded-2xl shadow-xl text-center">
                <h2 className="text-2xl font-bold text-red-600 mb-2">Wait! The Cow is stuck!</h2>
                <p className="text-slate-600 mb-6">To return to the Old Lady, click the animals in the <strong>exact order</strong> you found them.</p>
                <div className="flex justify-center gap-2 mb-8 h-12">
                    {sequence.map((anim, i) => <span key={i} className="px-3 py-2 bg-blue-100 text-blue-800 rounded font-bold border border-blue-300 animate-pop">{anim}</span>)}
                </div>
                {error && <div className="mb-4 text-red-500 font-bold flex items-center justify-center gap-2"><AlertCircle size={20} /> Wrong order! Resetting...</div>}
                <div className="flex flex-wrap justify-center gap-3">
                    {[...new Set(inventory)].sort().map((anim) => (
                    <button key={anim} disabled={sequence.includes(anim) || error} onClick={() => handleSelect(anim)} className="px-4 py-3 bg-slate-100 hover:bg-slate-200 border-2 border-slate-300 rounded-lg font-bold disabled:opacity-50 transition-colors">{anim}</button>
                    ))}
                </div>
            </div>
        );
    }

    function GameEngine({ stageData, questionIndex, setQuestionIndex, onStageComplete, currentLocation }) {
        const [status, setStatus] = useState('playing'); 
        const handleCorrect = () => {
            setStatus('correct');
            setTimeout(() => {
                setStatus('playing');
                if (questionIndex < 4) setQuestionIndex(prev => prev + 1);
                else onStageComplete();
            }, 1500);
        };
        const handleWrong = () => {
            setStatus('wrong');
            setTimeout(() => setStatus('playing'), 1000);
        };
        const currentQuestion = stageData.questions[questionIndex];
        const bgClass = status === 'correct' ? 'bg-green-50 border-green-400' : status === 'wrong' ? 'bg-red-50 border-red-400' : 'bg-white border-slate-200';

        return (
            <div className={`p-6 rounded-2xl shadow-xl border-4 transition-colors duration-300 ${bgClass} relative overflow-hidden`}>
                <div className="flex justify-between items-center mb-4 text-sm font-bold text-slate-500">
                    <div className="flex items-center
